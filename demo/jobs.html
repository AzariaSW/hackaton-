<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Bridge - Career Gateway Demo</title>
  <style>
    body {
      font-family: 'Noto Sans Ethiopic', system-ui, -apple-system, sans-serif;
      max-width: 54rem;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
      background: #f5f7fa;
      color: #111827;
      line-height: 1.6;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .btn, a.btn {
      font: inherit;
      font-weight: 600;
      min-height: 2.75rem;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      border: 2px solid #0052a3;
      background: #0052a3;
      color: #ffffff;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .btn-outline {
      background: #ffffff;
      color: #111827;
      border-color: #6b7280;
    }

    .filter-box {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 0.75rem;
      padding: 1rem 1.25rem;
      margin-bottom: 1.25rem;
    }

    .privacy-note {
      font-size: 0.9375rem;
      color: #134e4a;
      background: #f0fdfa;
      border-inline-start: 4px solid #0f766e;
      padding: 0.65rem 0.9rem;
      border-radius: 0.35rem;
      margin-bottom: 0.75rem;
    }

    .jobs-list {
      display: grid;
      gap: 1rem;
    }

    .job-card {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 0.75rem;
      padding: 1.25rem;
    }

    .job-card h2 {
      margin: 0 0 0.35rem;
      font-size: 1.25rem;
    }

    .job-meta {
      font-size: 0.9375rem;
      color: #4b5563;
      margin-bottom: 0.65rem;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 0.75rem 0;
    }

    .tag {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e3a8a;
      padding: 0.25rem 0.6rem;
      border-radius: 0.35rem;
      font-size: 0.875rem;
      font-weight: 600;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 0.85rem;
    }

    dialog {
      max-width: 44rem;
      width: calc(100% - 2rem);
      border: 2px solid #111827;
      border-radius: 0.75rem;
      padding: 1.25rem;
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.55);
    }

    :focus-visible {
      outline: 3px solid #f5a300;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Career Gateway — Accessible Jobs Demo</h1>
      <p>Reuses <code>&lt;db-signup mode="job-apply"&gt;</code> and embeds <code>schema.org/JobPosting</code> JSON-LD.</p>
    </div>
    <div style="display:flex; flex-wrap:wrap; gap:0.5rem; align-items:center;">
      <label for="jobs-lang" style="font-weight:600;">Language:</label>
      <select id="jobs-lang" class="btn btn-outline">
        <option value="en" selected>English (en)</option>
        <option value="am">አማርኛ (am)</option>
      </select>
      <a class="btn btn-outline" href="/">← Back to Registration Demo</a>
    </div>
  </header>

  <main>
    <section class="filter-box" aria-label="Local support filter">
      <div class="privacy-note">
        <strong>Privacy guarantee:</strong> Filtering runs 100% inside your browser using your locally saved support preferences. Nothing is sent to employers.
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:0.75rem; align-items:center;">
        <label style="display:inline-flex; align-items:center; gap:0.5rem; min-height:2.75rem; cursor:pointer;">
          <input type="checkbox" id="filter-my-support" style="width:1.25rem; height:1.25rem;">
          <span>Filter jobs matching my locally saved support needs (<span id="saved-support-summary">none saved</span>)</span>
        </label>
      </div>
    </section>

    <section id="jobs-container" class="jobs-list" aria-label="Job listings"></section>
  </main>

  <dialog id="apply-dialog" aria-labelledby="apply-title">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:0.5rem; margin-bottom:0.75rem;">
      <h2 id="apply-title" style="margin:0;">Apply for Job</h2>
      <button type="button" id="close-dialog" class="btn btn-outline">Close</button>
    </div>
    <script src="/module/db-signup.js" defer></script>
    <db-signup id="job-apply-widget" lang="en" mode="job-apply"></db-signup>
  </dialog>

  <script>
    const SUPPORT_LABELS = {
      screen_reader: 'Screen reader friendly',
      large_text: 'Large text / magnification',
      captions: 'Captioned meetings',
      sign_language: 'Sign language support',
      interpreter_am: 'Amharic / local interpreter',
      more_time: 'Flexible deadlines / extra time'
    };

    let allJobs = [];
    let currentLang = 'en';
    const filterCheckbox = document.getElementById('filter-my-support');
    const summarySpan = document.getElementById('saved-support-summary');
    const jobsContainer = document.getElementById('jobs-container');
    const applyDialog = document.getElementById('apply-dialog');
    const applyTitle = document.getElementById('apply-title');
    const applyWidget = document.getElementById('job-apply-widget');
    const closeDialogBtn = document.getElementById('close-dialog');
    const langSelect = document.getElementById('jobs-lang');

    function getSavedSupport() {
      try {
        const raw = localStorage.getItem('db-signup:support-local');
        return raw ? JSON.parse(raw) : [];
      } catch {
        return [];
      }
    }

    function updateSavedSummary() {
      const saved = getSavedSupport();
      summarySpan.textContent = saved.length > 0 ? saved.join(', ') : 'none saved yet';
    }

    function injectJobJsonLd(jobs) {
      const ld = jobs.map((job) => ({
        '@context': 'https://schema.org',
        '@type': 'JobPosting',
        title: job.title,
        description: job.summary,
        datePosted: job.datePosted,
        employmentType: job.employmentType,
        jobLocationType: job.remote ? 'TELECOMMUTE' : undefined,
        hiringOrganization: { '@type': 'Organization', name: job.employer },
        jobLocation: {
          '@type': 'Place',
          address: { '@type': 'PostalAddress', addressLocality: job.location, addressCountry: 'ET' }
        },
        jobBenefits: job.accommodations.map((a) => SUPPORT_LABELS[a] || a).join(', ')
      }));
      const script = document.createElement('script');
      script.type = 'application/ld+json';
      script.textContent = JSON.stringify(ld);
      document.head.appendChild(script);
    }

    function renderJobs() {
      const savedSupport = getSavedSupport();
      const applyFilter = filterCheckbox.checked && savedSupport.length > 0;
      const visible = applyFilter
        ? allJobs.filter((j) => savedSupport.every((need) => j.accommodations.includes(need)))
        : allJobs;

      jobsContainer.innerHTML = '';
      if (visible.length === 0) {
        const p = document.createElement('p');
        p.textContent = 'No demo jobs match all of your saved support filters. Uncheck the filter to view all jobs.';
        jobsContainer.appendChild(p);
        return;
      }

      for (const job of visible) {
        const title = currentLang === 'am' && job.titleAm ? job.titleAm : job.title;
        const summary = currentLang === 'am' && job.summaryAm ? job.summaryAm : job.summary;
        const article = document.createElement('article');
        article.className = 'job-card';
        article.setAttribute('lang', currentLang);

        const h2 = document.createElement('h2');
        h2.textContent = title;
        article.appendChild(h2);

        const meta = document.createElement('div');
        meta.className = 'job-meta';
        meta.textContent = `${job.employer} · ${job.location} · ${job.employmentType}`;
        article.appendChild(meta);

        const p = document.createElement('p');
        p.textContent = summary;
        article.appendChild(p);

        const tags = document.createElement('div');
        tags.className = 'tags';
        for (const acc of job.accommodations) {
          const span = document.createElement('span');
          span.className = 'tag';
          span.textContent = SUPPORT_LABELS[acc] || acc;
          tags.appendChild(span);
        }
        article.appendChild(tags);

        const actions = document.createElement('div');
        actions.className = 'card-actions';

        const listenBtn = document.createElement('button');
        listenBtn.type = 'button';
        listenBtn.className = 'btn btn-outline';
        listenBtn.textContent = currentLang === 'am' ? '🔊 ማጠቃለያውን አዳምጥ' : '🔊 Listen to summary';
        listenBtn.addEventListener('click', () => {
          if (window.speechSynthesis) {
            window.speechSynthesis.cancel();
            const utt = new SpeechSynthesisUtterance(`${title}. ${summary}`);
            utt.lang = currentLang === 'am' ? 'am-ET' : 'en-US';
            window.speechSynthesis.speak(utt);
          }
        });

        const applyBtn = document.createElement('button');
        applyBtn.type = 'button';
        applyBtn.className = 'btn';
        applyBtn.textContent = currentLang === 'am' ? 'አሁን ያመልክቱ' : 'Apply now';
        applyBtn.addEventListener('click', () => {
          applyTitle.textContent = `${currentLang === 'am' ? 'ማመልከቻ፡' : 'Apply:'} ${title}`;
          applyDialog.showModal();
        });

        actions.appendChild(listenBtn);
        actions.appendChild(applyBtn);
        article.appendChild(actions);
        jobsContainer.appendChild(article);
      }
    }

    langSelect.addEventListener('change', () => {
      currentLang = langSelect.value;
      document.documentElement.lang = currentLang;
      applyWidget.setAttribute('lang', currentLang);
      renderJobs();
    });

    closeDialogBtn.addEventListener('click', () => applyDialog.close());
    filterCheckbox.addEventListener('change', renderJobs);

    fetch('/demo/data/jobs.json')
      .then((r) => r.json())
      .then((jobs) => {
        allJobs = jobs;
        updateSavedSummary();
        injectJobJsonLd(jobs);
        renderJobs();
      });
  </script>
</body>
</html>
